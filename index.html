<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proposal Builder</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Proposal Builder</h1>
    <p class="tagline">Create, customize, and send client proposals.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>New Proposal</h2>
      <form id="proposal-form">
        <label for="client-name">Client Name</label>
        <input type="text" id="client-name" placeholder="Acme Corp" required />

        <label for="project-title">Project Title</label>
        <input type="text" id="project-title" placeholder="Website Redesign" required />

        <label for="project-scope">Scope</label>
        <textarea id="project-scope" rows="4" placeholder="Describe the work..."></textarea>

        <label for="project-price">Price ($)</label>
        <input type="number" id="project-price" placeholder="2500" min="0" step="0.01" />

        <button type="submit">Save Draft</button>
      </form>
      <p id="status" class="status" hidden></p>
    </section>

    <section class="card">
      <h2>Drafts</h2>
      <ul id="draft-list" class="draft-list">
        <li class="empty">No drafts yet.</li>
      </ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
